<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notenbuch Deutsch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @layer base {
            *, *::before, *::after { box-sizing: border-box; }
            html, body {
                margin: 0; padding: 0;
                min-height: 100vh;
                background: #faf7f2;
                color: #2a2a36;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            }
            ::-webkit-scrollbar { width: 5px; height: 5px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #e9aab7; border-radius: 3px; }
            ::-webkit-scrollbar-thumb:hover { background: #dc8294; }
            select option { background: #faf7f2; color: #2a2a36; }
            input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }
            code {
                font-family: 'JetBrains Mono', monospace;
                font-size: 0.78em;
                background: #f4efe6;
                padding: 1px 5px; border-radius: 3px;
            }
            strong { font-weight: 700; }
        }

        @layer components {
            /* ══ Design-System Variablen ══════════════════════════════ */
            :root {
                --paper:        #faf7f2;
                --paper-soft:   #f4efe6;
                --paper-line:   #ece5d8;
                --ink:          #2a2a36;
                --ink-soft:     #4a4a5a;
                --ink-mute:     #8a8898;
                --ink-faint:    #c9c5d3;
                --rose-50:      #fdf5f6;
                --rose-100:     #f9e6ea;
                --rose-200:     #f3cdd5;
                --rose-300:     #e9aab7;
                --rose-400:     #dc8294;
                --rose-500:     #c95f76;
                --leaf-200:     #d4e0cc;
                --leaf-500:     #6b8a5e;
                --sun-200:      #f0e4b8;
                --sun-500:      #b89530;
                --note-1:       #d4e0cc; --note-1-fg:    #4a6440;
                --note-2:       #e3e0c2; --note-2-fg:    #6a6230;
                --note-3:       #f0e4b8; --note-3-fg:    #8a7430;
                --note-4:       #f0d4b8; --note-4-fg:    #8a5a30;
                --note-5:       #f3cdd5; --note-5-fg:    #8a3a4a;
                --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
                --shadow-sm: 0 1px 2px rgba(42,42,54,.04);
                --shadow-md: 0 2px 8px rgba(42,42,54,.06), 0 1px 2px rgba(42,42,54,.04);
                --shadow-lg: 0 8px 24px rgba(42,42,54,.08), 0 2px 6px rgba(42,42,54,.04);
                --font-serif: 'Lora', Georgia, serif;
                --font-sans:  'Inter', -apple-system, sans-serif;
                --font-mono:  'JetBrains Mono', monospace;
            }

            /* ── Bootstrap compat for JS-generated HTML ──── */
            .d-flex      { display: flex; }
            .d-none      { display: none; }
            .d-md-inline { display: inline; }
            .flex-grow-1 { flex-grow: 1; }
            .flex-wrap   { flex-wrap: wrap; }
            .flex-shrink-0 { flex-shrink: 0; }
            .flex-column { flex-direction: column; }
            .pe-1  { padding-right: 0.25rem; }
            .gap-1 { gap: 0.25rem; }
            .gap-3 { gap: 0.75rem; }
            .align-items-center      { align-items: center; }
            .justify-content-between { justify-content: space-between; }
            .justify-content-center  { justify-content: center; }
            .fw-semibold { font-weight: 600; }
            .fw-bold     { font-weight: 700; }
            .text-muted  { color: var(--ink-mute); }
            .text-center { text-align: center; }
            .text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .text-primary { color: var(--rose-500); }
            .text-white   { color: var(--ink) !important; }
            .text-white-50 { color: var(--ink-mute); }
            .small { font-size: 0.78rem; }
            .mb-0 { margin-bottom: 0; }
            .mb-1 { margin-bottom: 0.25rem; }
            .mb-2 { margin-bottom: 0.5rem; }
            .mb-3 { margin-bottom: 0.75rem; }
            .mt-1 { margin-top: 0.25rem; }
            .mt-2 { margin-top: 0.5rem; }
            .mt-3 { margin-top: 0.75rem; }
            .me-1 { margin-right: 0.25rem; }
            .me-2 { margin-right: 0.5rem; }
            .rounded { border-radius: var(--r-sm); }
            .border { border: 1px solid var(--paper-line); }
            .bg-white { background: #fff !important; }
            .h5 { font-size: 1.1rem; font-weight: 600; margin: 0; font-family: var(--font-serif); }

            /* ── Buttons ─────────────────────────────────── */
            .btn {
                display: inline-flex; align-items: center; justify-content: center;
                border-radius: var(--r-sm); font-family: var(--font-sans);
                font-size: 0.82rem; font-weight: 500;
                cursor: pointer; border: 1px solid var(--paper-line);
                transition: all 0.14s; line-height: 1; gap: 4px;
                text-decoration: none; user-select: none; white-space: nowrap;
                background: #fff; color: var(--ink-soft);
            }
            .btn:hover { background: var(--paper-soft); }
            .btn-sm   { padding: 5px 12px; font-size: 0.79rem; }
            .btn-xs   { padding: 2px 7px; font-size: 0.69rem; line-height: 1.5; }
            .btn-icon { padding: 3px 7px; font-size: 0.69rem; line-height: 1.5; }
            .btn-primary {
                background: var(--ink); color: #fff; border-color: var(--ink);
            }
            .btn-primary:hover { background: var(--ink-soft); border-color: var(--ink-soft); }
            .btn-secondary { background: var(--paper-soft); color: var(--ink-soft); border-color: var(--paper-line); }
            .btn-secondary:hover { background: var(--paper-line); }
            .btn-danger { background: #b91c1c; color: #fff; border-color: #b91c1c; }
            .btn-danger:hover { background: #991b1b; }
            .btn-outline-secondary { background: transparent; color: var(--ink-mute); border-color: var(--paper-line); }
            .btn-outline-secondary:hover { background: var(--paper-soft); color: var(--ink-soft); }
            .btn-outline-danger { background: transparent; color: #b91c1c; border-color: rgba(185,28,28,0.25); }
            .btn-outline-danger:hover { background: rgba(185,28,28,0.06); }
            .btn-outline-light { background: transparent; color: var(--ink-mute); border-color: var(--paper-line); }
            .btn-outline-light:hover { background: var(--paper-soft); color: var(--ink); }
            .btn-close {
                background: transparent; border: none; cursor: pointer;
                color: var(--ink-mute); font-size: 1.2rem; padding: 2px 6px;
                border-radius: var(--r-sm); line-height: 1;
                display: inline-flex; align-items: center; justify-content: center;
                font-style: normal;
            }
            .btn-close:hover { color: var(--ink); background: var(--paper-soft); }
            .btn-close-white { color: var(--ink-mute); }

            /* ── Form Controls ───────────────────────────── */
            .form-control {
                display: block; width: 100%;
                padding: 7px 11px;
                background: #fff;
                border: 1px solid var(--paper-line);
                border-radius: var(--r-sm); color: var(--ink);
                font-family: var(--font-sans);
                font-size: 0.875rem;
                transition: border-color 0.14s, box-shadow 0.14s;
            }
            .form-control:focus {
                outline: none; border-color: var(--rose-300);
                box-shadow: 0 0 0 3px var(--rose-50);
            }
            .form-control::placeholder { color: var(--ink-faint); font-style: italic; }
            .form-control-sm { padding: 4px 9px; font-size: 0.81rem; border-radius: var(--r-sm); }
            .form-label { display: block; font-size: 0.79rem; font-weight: 500; color: var(--ink-mute); margin-bottom: 5px; }
            .form-label-sm { font-size: 0.75rem; }
            .input-group { display: flex; }
            .input-group .form-control { border-radius: var(--r-sm) 0 0 var(--r-sm); flex: 1; min-width: 0; }
            .input-group-text {
                padding: 4px 9px;
                background: var(--paper-soft);
                border: 1px solid var(--paper-line);
                border-left: none; border-radius: 0 var(--r-sm) var(--r-sm) 0;
                color: var(--ink-mute); font-size: 0.79rem;
            }
            .input-group-sm .form-control { padding: 3px 7px; font-size: 0.79rem; }

            /* ── Tables ──────────────────────────────────── */
            .table-wrapper {
                overflow-x: auto;
                border-radius: var(--r-md);
                border: 1px solid var(--paper-line);
                box-shadow: var(--shadow-md);
            }
            .grade-table {
                min-width: max-content; background: #fff;
                margin-bottom: 0; font-size: .81rem; width: 100%; border-collapse: collapse;
            }
            .grade-table th, .grade-table td {
                vertical-align: middle; white-space: nowrap;
                padding: 8px 11px;
                border: 1px solid var(--paper-line);
            }
            .grade-table thead tr:first-child th {
                background: var(--paper); color: var(--ink-soft);
                border-color: var(--paper-line);
                font-size: 0.75rem; letter-spacing: 0.04em; font-weight: 500;
                text-transform: uppercase;
            }
            .grade-table thead tr:nth-child(2) th {
                background: var(--paper-soft); color: var(--ink-mute);
                border-color: var(--paper-line);
                font-size: .73rem; padding: 4px 8px;
            }
            .grade-table tbody tr:hover td { background-color: var(--rose-50) !important; }
            .table-sm td, .table-sm th { padding: 5px 8px; }
            .table-bordered td, .table-bordered th { border: 1px solid var(--paper-line); }

            .grade-table td.sticky-col[style*="#dbeafe"],
            .grade-table tr[style*="#dbeafe"] td { background: rgba(233,170,183,0.08) !important; }

            /* Sticky column */
            .sticky-col {
                position: sticky; left: 0; z-index: 2;
                background: #fff; min-width: 180px;
                box-shadow: 3px 0 8px rgba(42,42,54,0.06);
            }
            .grade-table thead .sticky-col { z-index: 3; background: var(--paper) !important; }

            /* Column header colors — warm pastel palette */
            .th-sa1   { background: #e8eaf6 !important; color: #3949ab !important; border-color: rgba(57,73,171,0.12) !important; }
            .th-sa2   { background: #e8eaf6 !important; color: #3949ab !important; border-color: rgba(57,73,171,0.12) !important; }
            .th-wdh   { background: var(--rose-100) !important; color: var(--rose-500) !important; border-color: var(--rose-200) !important; }
            .th-praes { background: var(--sun-200) !important; color: var(--sun-500) !important; border-color: rgba(184,149,48,0.2) !important; }
            .th-ha    { background: var(--leaf-200) !important; color: var(--leaf-500) !important; border-color: rgba(107,138,94,0.2) !important; }
            .th-komm  { background: var(--paper-soft) !important; color: var(--ink-mute) !important; border-color: var(--paper-line) !important; }
            .th-zp    { background: #ede7f6 !important; color: #6a1b9a !important; border-color: rgba(106,27,154,0.15) !important; }

            /* Cell tints */
            .td-sa1   { background: rgba(232,234,246,0.3); }
            .td-sa2   { background: rgba(232,234,246,0.3); }
            .td-wdh   { background: rgba(249,230,234,0.35); }
            .td-praes { background: rgba(240,228,184,0.3); }
            .td-ha    { background: rgba(212,224,204,0.3); }
            .td-zp    { background: rgba(237,231,246,0.3); }

            /* Cell inputs */
            .cell-input {
                width: 58px; padding: 3px 4px;
                background: #fff;
                border: 1px solid var(--paper-line);
                border-radius: var(--r-sm); text-align: center;
                font-size: .81rem; color: var(--ink);
                font-family: var(--font-mono);
                transition: border-color .12s, box-shadow .12s;
            }
            .cell-input:focus { outline: none; border-color: var(--rose-300); box-shadow: 0 0 0 2px var(--rose-50); }
            .cell-input:invalid { border-color: #b91c1c; background: rgba(185,28,28,0.04); }
            .wdh-inp { width: 72px; }

            .ha-select, .praes-select, .zp-select {
                padding: 3px 5px;
                background: #fff;
                border: 1px solid var(--paper-line);
                border-radius: var(--r-sm); font-size: .81rem; color: var(--ink); cursor: pointer;
            }
            .ha-select:focus, .praes-select:focus, .zp-select:focus { outline: none; border-color: var(--rose-300); }
            .ha-alle-select {
                padding: 3px 6px;
                background: var(--rose-50);
                border: 1px solid var(--rose-200);
                border-radius: var(--r-sm); font-size: .79rem; color: var(--rose-500); cursor: pointer;
            }

            /* Read-only cells */
            .cell-ro {
                display: inline-block; min-width: 36px; padding: 2px 7px;
                text-align: center; font-size: .81rem;
                font-family: var(--font-mono);
                background: var(--paper-soft);
                border-radius: var(--r-sm); color: var(--ink-soft);
            }

            /* Note badges */
            .note-badge {
                display: inline-flex; align-items: center; justify-content: center;
                width: 36px; height: 36px; border-radius: 50%;
                font-weight: 600; font-size: .85rem;
                font-family: var(--font-serif);
                border: none; letter-spacing: 0;
            }
            .note-empty  { background: var(--paper-soft); color: var(--ink-faint); width: 36px; }
            .note-1 { background: var(--note-1); color: var(--note-1-fg); }
            .note-2 { background: var(--note-2); color: var(--note-2-fg); }
            .note-3 { background: var(--note-3); color: var(--note-3-fg); }
            .note-4 { background: var(--note-4); color: var(--note-4-fg); }
            .note-5 { background: var(--note-5); color: var(--note-5-fg); }
            .note-borderline::after { content: '*'; font-size: .58rem; vertical-align: super; margin-left: 1px; opacity: .6; }

            /* Comment textarea */
            .komm-input {
                width: 160px; min-height: 27px; max-height: 27px; padding: 3px 6px;
                font-size: .78rem;
                background: #fff;
                border: 1px solid var(--paper-line);
                border-radius: var(--r-sm); resize: none; color: var(--ink);
                font-family: var(--font-sans);
                transition: max-height .2s, border-color .12s; overflow: hidden;
            }
            .komm-input:focus { max-height: 90px; outline: none; border-color: var(--rose-300); box-shadow: 0 0 0 2px var(--rose-50); overflow: auto; }
            .komm-input::placeholder { color: var(--ink-faint); font-style: italic; }

            /* ── Part Tabs (Schularbeiten / Wiederholungen etc.) ── */
            .class-tabs {
                display: flex; border-bottom: 1px solid var(--paper-line);
                margin-bottom: 1rem; gap: 0; overflow-x: auto;
                background: var(--paper-soft);
                padding: 8px 12px 0;
            }
            .class-tabs .nav-item { display: flex; }
            .class-tabs .nav-link {
                color: var(--ink-mute); padding: 6px 12px;
                font-size: .84rem; border: 1px solid transparent;
                border-bottom: none; border-radius: var(--r-sm) var(--r-sm) 0 0;
                margin-bottom: -1px;
                cursor: pointer; text-decoration: none;
                transition: color 0.14s, background 0.14s; background: transparent;
                white-space: nowrap; display: flex; align-items: center; gap: 5px;
                font-family: var(--font-sans); font-weight: 500;
            }
            .class-tabs .nav-link:hover { color: var(--ink-soft); background: rgba(255,255,255,0.6); }
            .class-tabs .nav-link.active {
                color: var(--ink); background: #fff;
                border-color: var(--paper-line); border-bottom-color: #fff;
                font-weight: 600;
            }
            .nav-link { cursor: pointer; }

            /* ── SA sub-tabs ─────────────────────────────── */
            .sa-tab-bar {
                display: flex; align-items: center; gap: 3px;
                margin-bottom: 1rem; flex-wrap: wrap;
                padding: 0 2px;
            }
            .sa-tab {
                display: flex; align-items: center; gap: 4px;
                padding: 6px 13px; border-radius: var(--r-sm) var(--r-sm) 0 0;
                background: var(--paper-soft);
                border: 1px solid var(--paper-line);
                border-bottom: none; cursor: pointer;
                font-size: .84rem; color: var(--ink-mute);
                transition: background 0.12s, color 0.12s;
                font-family: var(--font-sans); font-weight: 500;
                margin-bottom: -1px;
            }
            .sa-tab:hover { background: rgba(255,255,255,0.7); color: var(--ink-soft); }
            .sa-tab.active { background: #fff; border-color: var(--paper-line); border-bottom-color: #fff; color: var(--ink); }
            .sa-tab span { cursor: pointer; }
            .sa-tab-del {
                background: none; border: none; color: inherit;
                opacity: .5; font-size: .9rem; padding: 0 2px;
                cursor: pointer; line-height: 1;
            }
            .sa-tab-del:hover { opacity: 1; color: #b91c1c; }
            .sa-tab-del.confirm { color: #b91c1c; opacity: 1; font-weight: 700; }
            .sa-tab-add {
                background: none; border: 1px dashed var(--paper-line);
                border-radius: var(--r-sm); color: var(--leaf-500); font-size: 1.1rem;
                padding: 3px 10px; cursor: pointer; line-height: 1;
                transition: background 0.12s;
            }
            .sa-tab-add:hover { background: var(--leaf-200); }

            /* ── Semester tabs ───────────────────────────────── */
            .semester-tab-bar {
                display: flex; gap: 4px; margin-bottom: 0;
                padding: 10px 14px; background: #fff;
                border-bottom: 1px solid var(--paper-line);
            }
            .semester-tab {
                padding: 6px 16px; border-radius: 999px;
                border: none; background: transparent; color: var(--ink-mute);
                cursor: pointer; font-size: .85rem; font-family: var(--font-sans); font-weight: 500;
                transition: background 0.12s, color 0.12s;
            }
            .semester-tab:hover { background: var(--paper-soft); color: var(--ink-soft); }
            .semester-tab.active { background: var(--rose-50); color: var(--rose-500); }
            .semester-tab.jahr-tab.active { background: var(--leaf-200); color: var(--leaf-500); }
            .semester-tab.schueler-tab { margin-left: auto; }
            .semester-tab.schueler-tab.active { background: var(--paper-soft); color: var(--ink); border: 1px solid var(--paper-line); }

            /* Weight card */
            .weight-card {
                background: var(--paper-soft);
                border: 1px solid var(--paper-line);
                border-radius: var(--r-md); padding: 1rem 1.25rem; margin-bottom: 1rem;
            }
            .weight-input { width: 70px; text-align: center; font-size: .87rem; font-family: var(--font-mono); }
            .weight-sum-ok   { color: var(--leaf-500); font-weight: 600; }
            .weight-sum-warn { color: var(--note-5-fg); font-weight: 600; }

            /* Empty states */
            .empty-state { text-align: center; padding: 3rem 2rem; color: var(--ink-mute); }
            .empty-state i { font-size: 2.5rem; color: var(--ink-faint); display: block; margin-bottom: 0.5rem; }
            .empty-state h5, .empty-state h6 { color: var(--ink-soft); margin-bottom: 0.5rem; font-family: var(--font-serif); }

            /* Toast */
            .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1100; }
            .toast {
                background: var(--leaf-200);
                border: 1px solid rgba(107,138,94,0.3);
                border-radius: var(--r-md); padding: 0; color: var(--leaf-500);
                font-size: 0.84rem;
                box-shadow: var(--shadow-lg);
                opacity: 0; transform: translateY(6px) scale(0.98);
                transition: opacity 0.2s, transform 0.2s;
                pointer-events: none;
            }
            .toast.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
            .toast-body { padding: 10px 16px; display: flex; align-items: center; gap: 6px; }
            .border-0 { border: none; }
            .align-items-center { align-items: center; }

            /* ── Navbar / Header ─────────────────────────── */
            #app-navbar {
                background: var(--paper);
                border-bottom: 1px solid var(--paper-line);
                display: flex; align-items: center;
                padding: 0 2rem; gap: 1rem; height: 56px;
                position: sticky; top: 0; z-index: 100;
                box-shadow: var(--shadow-sm);
            }
            #app-navbar .brand {
                font-family: var(--font-serif);
                font-size: 1.2rem; font-weight: 600;
                color: var(--ink); display: flex; align-items: center; gap: 12px;
                letter-spacing: -0.01em;
            }
            #app-navbar .brand svg { flex-shrink: 0; }
            #app-navbar .subtitle {
                font-size: 0.72rem; color: var(--ink-mute);
                font-weight: 400; letter-spacing: 0.03em;
                margin-left: auto; display: none;
            }
            @media (min-width: 640px) { #app-navbar .subtitle { display: block; } }

            /* ── Layout ──────────────────────────────────── */
            #app-layout {
                display: flex; min-height: calc(100vh - 56px);
            }

            /* Sidebar */
            #sidebar {
                width: 210px; flex-shrink: 0;
                background: var(--paper-soft);
                border-right: 1px solid var(--paper-line);
                padding: 18px 12px;
                display: flex; flex-direction: column; gap: 18px;
                overflow-y: auto;
            }
            .sidebar-group-label {
                font-size: 10.5px; font-weight: 500; letter-spacing: .07em;
                text-transform: uppercase; color: var(--ink-mute);
                padding: 0 6px; margin-bottom: 4px;
            }

            /* ── Schuljahr selector ── */
            #schuljahr-selector {
                display: flex; flex-wrap: wrap; gap: 4px;
                padding: 8px 8px 6px 8px;
                border-bottom: 1px solid var(--paper-line);
                margin-bottom: 6px;
            }
            .sj-wrap { position: relative; display: inline-flex; }
            .sj-chip {
                font-size: 11px; font-weight: 500;
                padding: 2px 8px; border-radius: 20px;
                cursor: pointer;
                background: var(--paper-line); color: var(--ink-soft);
                border: 1px solid transparent; white-space: nowrap;
                user-select: none;
            }
            .sj-chip.active {

<script>
// ================================================================
// KONSTANTEN
// ================================================================
// Notentabelle: Punkte (0–32) → {note, decimal, borderline}
const GRADE_TABLE = (() => {
    const t = [];
    for (let i = 0; i <= 14; i++) t[i] = {note:5, decimal:5.0,  bl:false};
    t[15]={note:5,decimal:4.75,bl:true};  t[16]={note:4,decimal:4.25,bl:false};
    t[17]={note:4,decimal:4.0, bl:false}; t[18]={note:4,decimal:4.0, bl:false};
    t[19]={note:4,decimal:3.75,bl:true};  t[20]={note:3,decimal:3.25,bl:false};
    t[21]={note:3,decimal:3.0, bl:false}; t[22]={note:3,decimal:3.0, bl:false};
    t[23]={note:3,decimal:3.0, bl:false}; t[24]={note:3,decimal:2.75,bl:true};
    t[25]={note:2,decimal:2.25,bl:false}; t[26]={note:2,decimal:2.0, bl:false};
    t[27]={note:2,decimal:2.0, bl:false}; t[28]={note:2,decimal:1.75,bl:true};
    t[29]={note:1,decimal:1.25,bl:false}; t[30]={note:1,decimal:1.0, bl:false};
    t[31]={note:1,decimal:1.0, bl:false}; t[32]={note:1,decimal:1.0, bl:false};
    return t;
})();

// ================================================================
// ZUSTAND
// ================================================================
let data = {schuljahre: [], activeSchuljahrId: null};
let activeClassId = null;
let activeTab = 'sa'; // 'sa' | 'wdh' | 'praes' | 'ha' | 'gesamt'
let activeSaId = null;
let activeSemester = 'semester1'; // 'semester1' | 'semester2'
let pendingDelete = null;
let undoSnapshot = null;
let redoSnapshot = null;

// ================================================================
// DATEN – Laden / Speichern / Migration
// ================================================================
async function loadData() {
    try {
        const r = await fetch('/api/data');
        if (r.ok) data = await r.json();
    } catch(e) { console.error('loadData failed', e); }
    migrateData();
}

function saveData() {
    fetch('/api/data', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(() => showToast()).catch(e => console.error('saveData failed', e));
}

function exportData() {
    const date = new Date().toISOString().slice(0, 10);
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `notenrechner-backup-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        let parsed;
        try {
            parsed = JSON.parse(e.target.result);
        } catch {
            alert('Fehler: Die Datei ist kein gültiges JSON.');
            return;
        }
        if (!parsed.classes && !parsed.schuljahre) {
            alert('Fehler: Die Datei enthält keine gültigen Notendaten.');
            return;
        }
        data = parsed;
        migrateData();
        saveData();
        render();
        alert('Daten wurden erfolgreich geladen.');
    };
    reader.readAsText(file);
    event.target.value = '';
}

function saveDataWithUndo() {
    redoSnapshot = null;
    saveData();
    updateUndoButtons();
}

function snapshotForUndo() {
    undoSnapshot = JSON.parse(JSON.stringify(data));
    redoSnapshot = null;
}

function undoData() {
    if (!undoSnapshot) return;
    redoSnapshot = JSON.parse(JSON.stringify(data));
    data = undoSnapshot;
    undoSnapshot = null;
    saveData(); render(); updateUndoButtons();
}

function redoData() {
    if (!redoSnapshot) return;
    undoSnapshot = JSON.parse(JSON.stringify(data));
    data = redoSnapshot;
    redoSnapshot = null;
    saveData(); render(); updateUndoButtons();
}

function updateUndoButtons() {
    const u = document.getElementById('btn-undo');
    const r = document.getElementById('btn-redo');
    if (u) u.disabled = !undoSnapshot;
    if (r) r.disabled = !redoSnapshot;
}

function migrateData() {
    // ── Migrate flat data.classes → schuljahre structure ──────────
    if (!data.schuljahre || !Array.isArray(data.schuljahre)) {
        const existingClasses = data.classes || [];
        const sjId = genId();
        const _y = new Date().getFullYear(), _m = new Date().getMonth();
        const _sjName = _m >= 8 ? `${_y}/${String(_y+1).slice(2)}` : `${_y-1}/${String(_y).slice(2)}`;
        data.schuljahre = [{ id: sjId, name: _sjName, classes: existingClasses }];
        data.activeSchuljahrId = sjId;
        delete data.classes;
    }
    if (!data.activeSchuljahrId || !data.schuljahre.find(s => s.id === data.activeSchuljahrId)) {
        data.activeSchuljahrId = data.schuljahre[0]?.id ?? null;
    }
    for (const sj of data.schuljahre) { for (const cls of sj.classes) {

        // ── Migrate flat structure → semester1 ──────────────────────
        if (!cls.semester1) {
            const saId = genId();
            cls.semester1 = {
                schularbeiten: cls.schularbeiten || [{id: saId, name: '1. Schularbeit'}],
                wiederholungen:  cls.wiederholungen  || [],
                praesentationen: cls.praesentationen || [],
                hausaufgaben:    cls.hausaufgaben    || [],
                gewichtung:      cls.gewichtung      || {schularbeiten:40, wiederholung:20, praesentation:20, hausaufgaben:20},
                studentData: {}
            };

            // Migrate old sa1/sa2 weights → schularbeiten on semester1
            const g1 = cls.semester1.gewichtung;
            if (g1.sa1 !== undefined || g1.sa2 !== undefined) {
                g1.schularbeiten = (+(g1.sa1)||0) + (+(g1.sa2)||0);
                delete g1.sa1; delete g1.sa2;
            }
            if (g1.schularbeiten === undefined) g1.schularbeiten = 40;

            // Migrate old fixed schularbeiten entries in the array if needed
            if (!cls.semester1.schularbeiten.length) {
                cls.semester1.schularbeiten = [{id: saId, name: '1. Schularbeit'}];
            }

            // Migrate student grade data → semester1.studentData
            for (const s of (cls.students || [])) {
                const sd = { schularbeiten:{}, wiederholungen:{}, praesentationen:{}, hausaufgaben:{} };

                // Migrate old fixed schularbeit1/2
                if (s.schularbeit1 !== undefined) {
                    sd.schularbeiten['sa1-legacy'] = {
                        aufgabenstellung: s.schularbeit1?.aufgabenstellung ?? null,
                        fehler:           s.schularbeit1?.fehler           ?? null,
                        wortschatz:       s.schularbeit1?.wortschatz       ?? null,
                        textorganisation: s.schularbeit1?.textorganisation ?? null,
                        kommentar:        s.kommentar1 ?? ''
                    };
                    delete s.schularbeit1;
                }
                if (s.schularbeit2 !== undefined) {
                    sd.schularbeiten['sa2-legacy'] = {
                        aufgabenstellung: s.schularbeit2?.aufgabenstellung ?? null,
                        fehler:           s.schularbeit2?.fehler           ?? null,
                        wortschatz:       s.schularbeit2?.wortschatz       ?? null,
                        textorganisation: s.schularbeit2?.textorganisation ?? null,
                        kommentar:        s.kommentar2 ?? ''
                    };
                    delete s.schularbeit2;
                }
                delete s.kommentar1; delete s.kommentar2;

                // Move already-migrated dynamic fields (merge to preserve legacy entries)
                if (s.schularbeiten)   Object.assign(sd.schularbeiten,   s.schularbeiten);
                if (s.wiederholungen)  Object.assign(sd.wiederholungen,  s.wiederholungen);
                if (s.praesentationen) Object.assign(sd.praesentationen, s.praesentationen);
                if (s.hausaufgaben)    Object.assign(sd.hausaufgaben,    s.hausaufgaben);
                delete s.schularbeiten; delete s.wiederholungen;
                delete s.praesentationen; delete s.hausaufgaben;

                cls.semester1.studentData[s.id] = sd;
            }

            // Delete flat fields from class
            delete cls.schularbeiten; delete cls.wiederholungen;
            delete cls.praesentationen; delete cls.hausaufgaben; delete cls.gewichtung;
        }

        // ── Ensure semester2 exists ──────────────────────────────────
        if (!cls.semester2) {
            cls.semester2 = {
                schularbeiten: [{id: genId(), name: '1. Schularbeit'}, {id: genId(), name: '2. Schularbeit'}],
                wiederholungen: [], praesentationen: [], hausaufgaben: [],
                gewichtung: {schularbeiten:40, wiederholung:20, praesentation:20, hausaufgaben:20},
                studentData: {}
            };
        }

        // ── Ensure type exists (all legacy classes are Unterstufe) ─────
        if (!cls.type) cls.type = 'unterstufe';

        // ── Ensure exactly 2 Schularbeiten per semester (Unterstufe only)
        if (cls.type === 'unterstufe') {
            for (const semKey of ['semester1','semester2']) {
                const sem = cls[semKey];
                if (sem && sem.schularbeiten && sem.schularbeiten.length < 2) {
                    const n = sem.schularbeiten.length + 1;
                    sem.schularbeiten.push({id: genId(), name: n + '. Schularbeit'});
                }
            }
        }
        // ── Ensure zwischenpruefung field exists on all studentData entries ──
        for (const semKey of ['semester1', 'semester2']) {
            const sem = cls[semKey];
            if (!sem) continue;
            for (const sid of Object.keys(sem.studentData || {})) {
                if (sem.studentData[sid].zwischenpruefung === undefined)
                    sem.studentData[sid].zwischenpruefung = null;
            }
        }
        // ── Ensure muendlicheMitarbeit exists on all studentData entries ──
        for (const semKey of ['semester1', 'semester2']) {
            const sem = cls[semKey];
            if (!sem) continue;
            if (sem.gewichtung && sem.gewichtung.muendlich === undefined)
                sem.gewichtung.muendlich = 0;
            for (const sid of Object.keys(sem.studentData || {})) {
                if (!sem.studentData[sid].muendlicheMitarbeit)
                    sem.studentData[sid].muendlicheMitarbeit = {note: null, kommentar: ''};
            }
        }
        // ── Ensure jahresnote exists ─────────────────────────────────
        if (!cls.jahresnote) cls.jahresnote = {gewichtung: {semester1: 50, semester2: 50}};
        if (cls.jahresnote.gewichtung.semester1 === undefined) cls.jahresnote.gewichtung.semester1 = 50;
        if (cls.jahresnote.gewichtung.semester2 === undefined) cls.jahresnote.gewichtung.semester2 = 50;

        // ── Ensure students list exists ──────────────────────────────
        if (!cls.students) cls.students = [];
    }} // closes for cls / for sj
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

    return sj ? sj.classes : [];

}

// Sprachrichtigkeit: MAX(0; 8 − GANZZAHL(Fehler / fehlerProPunkt))
function calcSprachrichtigkeit(fehler, fehlerProPunkt) {
    if (fehler === null || fehler === '' || fehler === undefined) return null;
    const f = parseInt(fehler, 10);
    const d = (fehlerProPunkt && fehlerProPunkt > 0) ? fehlerProPunkt : 3;
    if (isNaN(f) || f < 0) return null;
    return Math.max(0, 8 - Math.floor(f / d));
}

// Gesamtpunkte Schularbeit (max 32)
function calcGesamt(sa, fehlerProPunkt) {
    const sp = calcSprachrichtigkeit(sa.fehler, fehlerProPunkt ?? sa.fehlerProPunkt);
    const a  = parseOrNull(sa.aufgabenstellung);
    const w  = parseOrNull(sa.wortschatz);
    const t  = parseOrNull(sa.textorganisation);
    if (a === null && sp === null && w === null && t === null) return null;
    return (a ?? 0) + (sp ?? 0) + (w ?? 0) + (t ?? 0);
}

// Punkte → GRADE_TABLE-Eintrag
function calcNote(gesamt) {
    if (gesamt === null) return null;
    return GRADE_TABLE[Math.min(32, Math.max(0, gesamt))];
}

// Prozent → Ganzzahlnote (1–5)
function pctToNote(pct) {
    if (pct >= 90) return 1;
    if (pct >= 80) return 2;
    if (pct >= 70) return 3;
    if (pct >= 60) return 4;
    return 5;
}

// Dezimalnote → Ganzzahl (für Farbe)
function noteInt(dec) {
    if (dec < 1.5) return 1;
    if (dec < 2.5) return 2;
    if (dec < 3.5) return 3;
    if (dec < 4.5) return 4;
    return 5;
}

// Teilnote Wiederholung (Durchschnitt der Einzelnoten)
function calcWdhTeilnote(sem, sid) {
    const sd = sem.studentData?.[sid] || {};
    const wdhs = sem.wiederholungen || [];
    if (wdhs.length === 0) return null;
    const notes = [];
    for (const w of wdhs) {
        const val = sd.wiederholungen?.[w.id];
        if (val === null || val === undefined || val === '' || val === 'abwesend') continue;
        const pct = (parseFloat(val) / w.maxPunkte) * 100;
        notes.push(pctToNote(pct));
    }
    if (notes.length === 0) return null;
    return notes.reduce((a,b) => a+b, 0) / notes.length;
}

// Teilnote Präsentation (Durchschnitt der eingetragenen Noten)
function calcPraesTeilnote(sem, sid) {
    const sd = sem.studentData?.[sid] || {};
    const praes = sem.praesentationen || [];
    if (praes.length === 0) return null;
    const notes = [];
    for (const p of praes) {
        const val = sd.praesentationen?.[p.id];
        if (val === null || val === undefined || val === '') continue;
        const n = parseInt(val, 10);
        if (!isNaN(n) && n >= 1 && n <= 5) notes.push(n);
    }
    if (notes.length === 0) return null;
    return notes.reduce((a,b) => a+b, 0) / notes.length;
}

// Teilnote Hausübungen (Gesamtprozent → Note)
function calcHATeilnote(sem, sid) {
    const sd = sem.studentData?.[sid] || {};
    const has = sem.hausaufgaben || [];
    if (has.length === 0) return null;
    let achieved = 0, possible = 0;
    for (const h of has) {
        const val = sd.hausaufgaben?.[h.id];
        if (val === null || val === undefined || val === '' || val === 'k') continue;
        const v = parseFloat(val);
        if (isNaN(v)) continue;
        achieved += v;
        possible += 1;
    }
    if (possible === 0) return null;
    return pctToNote((achieved / possible) * 100);
}

// Teilnote Mündliche Mitarbeit (direkt eingegebene Note 1–5)
function calcMMTeilnote(sem, sid) {
    const sd = sem.studentData?.[sid] || {};
    const n = sd.muendlicheMitarbeit?.note;
    if (n === null || n === undefined || n === '') return null;
    const v = +n;
    return (v >= 1 && v <= 5) ? v : null;
}

// Gesamt-Schularbeitennote: Durchschnitt der Dezimalnoten aller SAs mit Daten
function calcSATeilnote(sem, sid) {
    const sas = sem.schularbeiten || [];
    const sd = sem.studentData?.[sid] || {};
    const notes = [];
    for (const sa of sas) {
        const saData = sd.schularbeiten?.[sa.id];
        if (!saData) continue;
        // Oberstufe: direkt eingegebene Note 1-5
        if (saData.note !== undefined && saData.note !== null && saData.note !== '') {
            notes.push(+saData.note);
            continue;
        }
        // Unterstufe: Punkte-basierte Berechnung
        const n = calcNote(calcGesamt(saData, sa.fehlerProPunkt ?? 3));
        if (n !== null) notes.push(n.decimal);
    }
    if (notes.length === 0) return null;
    return notes.reduce((a, b) => a + b, 0) / notes.length;
}

// Gesamtnote (gewichteter Durchschnitt)
function calcGesamtnote(cls, sem, s) {
    const g = sem.gewichtung || {};
    const saWeight = +(g.schularbeiten || 0);
    const wdhNote   = calcWdhTeilnote(sem, s.id);
    const praesNote = calcPraesTeilnote(sem, s.id);
    const haNote    = calcHATeilnote(sem, s.id);

    const saTeilnote = calcSATeilnote(sem, s.id);
    const mmNote = calcMMTeilnote(sem, s.id);
    const components = [
        {val: saTeilnote, w: saWeight},
        {val: wdhNote,   w: +(g.wiederholung  || 0)},
        {val: praesNote, w: +(g.praesentation || 0)},
        {val: haNote,    w: +(g.hausaufgaben  || 0)},
        {val: mmNote,    w: +(g.muendlich     || 0)},
    ];

    let sumW = 0, sumWN = 0;
    for (const c of components) {
        if (c.val !== null && c.w > 0) { sumWN += c.val * c.w; sumW += c.w; }
    }
    if (sumW === 0) return null;
    return sumWN / sumW;
}

function calcGesamtnoteAdjusted(cls, sem, s) {
    const raw = calcGesamtnote(cls, sem, s);
    if (raw === null) return null;
    const adj = sem.studentData?.[s.id]?.zwischenpruefung;
    if (adj === null || adj === undefined) return raw;
    return raw + adj;
}

function effectiveSemesterNote(cls, sem, s) {
    const sas = sem.schularbeiten || [];
    const sd  = sem.studentData?.[s.id] || {};
    const hasSAData = sas.some(sa => sd.schularbeiten?.[sa.id]);
    if (cls.type !== 'oberstufe' && hasSAData && !hasPositiveSA(sem, s)) return 5;
    return calcGesamtnoteAdjusted(cls, sem, s);
}

function calcJahresnote(cls, s) {
    const jg = cls.jahresnote?.gewichtung || {};
    const w1 = +(jg.semester1 || 0), w2 = +(jg.semester2 || 0);
    const n1 = effectiveSemesterNote(cls, cls.semester1, s);
    const n2 = effectiveSemesterNote(cls, cls.semester2, s);
    const comps = [];
    if (n1 !== null && w1 > 0) comps.push({val: n1, w: w1});
    if (n2 !== null && w2 > 0) comps.push({val: n2, w: w2});
    if (!comps.length) return null;
    const sumW = comps.reduce((a, c) => a + c.w, 0);
    return comps.reduce((a, c) => a + c.val * c.w, 0) / sumW;
}

// ── Hilfsfunktionen ────────────────────────────────────────────
function parseOrNull(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = parseInt(v, 10); return isNaN(n) ? null : n;
}
function fmtNote(val) {
    if (val === null || val === undefined) return '—';
    if (val % 1 === 0) return val.toString();
    return val.toFixed(2).replace('.', ',');
}
function fmtNoteModifier(decimal) {
    if (decimal === null || decimal === undefined) return '—';
    const frac = Math.round((decimal % 1) * 100);
    const base = Math.round(decimal - decimal % 1);
    if (frac === 75) return (base + 1) + '+';
    if (frac === 25) return base + '-';
    return Math.round(decimal).toString();
}
function fmtNote2(val) {
    if (val === null || val === undefined) return '—';
    return val.toFixed(2).replace('.', ',');
}
function fmtPct(pct) {
    if (pct === null || pct === undefined) return '—';
    return pct.toFixed(1).replace('.', ',') + '\u202f%';
}
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function noteBadgeSA(entry, id) {
    if (!entry) return `<span class="note-badge note-empty" id="${id}">—</span>`;
    return `<span class="note-badge note-${entry.note}" id="${id}" title="Ganzzahlnote: ${entry.note}">${fmtNoteModifier(entry.decimal)}</span>`;
}
function noteBadgeSAInt(entry, id) {
    if (!entry) return `<span class="note-badge note-empty" id="${id}">—</span>`;
    return `<span class="note-badge note-${entry.note}" id="${id}">${fmtNoteModifier(entry.decimal)}</span>`;
}
function noteBadgeSADec(entry, id) {
    if (!entry) return `<span class="cell-ro text-muted" id="${id}">—</span>`;
    return `<span class="cell-ro" id="${id}" style="font-weight:600">${fmtNote2(entry.decimal)}</span>`;
}
function noteBadgeDec(dec, id) {
    if (dec === null || dec === undefined) return `<span class="note-badge note-empty" id="${id}">—</span>`;
    const ni = noteInt(dec);
    return `<span class="note-badge note-${ni}" id="${id}">${fmtNote(dec)}</span>`;
}
function noteBadgeInt(n, id) {
    if (n === null || n === undefined) return `<span class="note-badge note-empty" id="${id}">—</span>`;
    return `<span class="note-badge note-${n}" id="${id}">${n}</span>`;
}

function newClass(name, type) {
    type = type || 'unterstufe';
    const isOberstufe = type === 'oberstufe';
    const semBase = () => ({
        schularbeiten: isOberstufe
            ? [{id: genId(), name: '1. Schularbeit'}]
            : [{id: genId(), name: '1. Schularbeit'}, {id: genId(), name: '2. Schularbeit'}],
        wiederholungen: [], praesentationen: [], hausaufgaben: [],
        gewichtung: {schularbeiten:40, wiederholung:20, praesentation:20, hausaufgaben:20, muendlich:0},
        studentData: {}
    });
    return {
        id: genId(), name: name.trim(), type: type, students: [],
        semester1: semBase(),
        semester2: semBase(),
        jahresnote: {gewichtung: {semester1: 50, semester2: 50}}
    };
}
function addClass(name, type) {
    const c=newClass(name, type); activeClasses().push(c);
    activeClassId=c.id; activeSemester='semester1';
    activeSaId=c.semester1.schularbeiten[0].id;
    saveData(); render();
}
function editClass(id, name)     { const c=activeClasses().find(c=>c.id===id); if(c){c.name=name.trim(); saveData(); render();} }
function deleteClass(id) {
    const sj = activeSchuljahr(); if(!sj) return;
    sj.classes = sj.classes.filter(c=>c.id!==id);
    if (activeClassId===id) activeClassId = activeClasses()[0]?.id ?? null;
    saveData(); render();
}

function openAddSchuljahr() {

}

function addSchuljahr(name) {
    const sjId = genId();
    const newSj = {
        id: sjId,
        name: name.trim(),
        classes: activeClasses().map(cls => {
            const fresh = newClass(cls.name, cls.type);
            fresh.students = cls.students.map(s => ({ id: genId(), name: s.name }));
            return fresh;
        })
    };
    data.schuljahre.push(newSj);
    data.activeSchuljahrId = sjId;
    activeClassId = newSj.classes[0]?.id ?? null;
    const initCls = newSj.classes[0];
    activeSaId = initCls?.semester1?.schularbeiten?.[0]?.id ?? null;

    activeSemester = 'semester1';

}

function deleteSchuljahr(sjId) {
    if (data.schuljahre.length <= 1) return;
    const sj = data.schuljahre.find(s => s.id === sjId);
    if (!sj) return;
    document.getElementById('confirm-delete-msg').innerHTML =
        `Schuljahr <strong>${esc(sj.name)}</strong> mit allen Noten wirklich löschen?`;
    pendingDelete = () => {
        data.schuljahre = data.schuljahre.filter(s => s.id !== sjId);
        if (data.activeSchuljahrId === sjId) {
            data.activeSchuljahrId = data.schuljahre[0]?.id ?? null;
            activeClassId = activeClasses()[0]?.id ?? null;
            const initCls = activeClasses()[0];
            activeSaId = initCls?.[activeSemester]?.schularbeiten?.[0]?.id ?? null;
            activeTab = 'sa';

}

function addSA() {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const sem = cls[activeSemester];
    if (sem.schularbeiten.length >= 2) return;
    const n = sem.schularbeiten.length + 1;

    sem.schularbeiten.push(sa);
    activeSaId = sa.id;
    saveData(); renderTabContent();
}

function selectSA(saId) {
    activeSaId = saId;
    renderTabContent();
}

function updateFehlerProPunkt(val) {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const sem = cls[activeSemester];
    const sa = sem.schularbeiten.find(s=>s.id===activeSaId); if(!sa) return;
    snapshotForUndo();
    const n = parseInt(val, 10);
    sa.fehlerProPunkt = (isNaN(n) || n < 1) ? 3 : n;
    saveDataWithUndo(); renderTabContent();
}

function deleteSA(saId) {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const sem = cls[activeSemester];
    if (sem.schularbeiten.length <= 1) return; // minimum 1
    sem.schularbeiten = sem.schularbeiten.filter(sa=>sa.id!==saId);
    for (const sd of Object.values(sem.studentData)) delete sd.schularbeiten[saId];
    if (activeSaId === saId) activeSaId = sem.schularbeiten[0].id;
    saveData(); renderTabContent();
}

function confirmDeleteSA(saId, btn) {
    if (btn.dataset.confirm === '1') {
        deleteSA(saId);
    } else {
        btn.dataset.confirm = '1';
        btn.classList.add('confirm');
        btn.textContent = '?';
        setTimeout(() => {
            if (btn.dataset.confirm === '1') {
                btn.dataset.confirm = '0';
                btn.classList.remove('confirm');
                btn.textContent = '×';
            }
        }, 2500);
    }
}

function addWdh(name, maxPunkte) {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    cls[activeSemester].wiederholungen.push({id:genId(), name:name.trim(), maxPunkte:+maxPunkte});
    saveData(); renderTabContent();
}
function editWdh(wid, name, maxPunkte) {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const w = cls[activeSemester].wiederholungen.find(w=>w.id===wid); if(!w) return;
    w.name=name.trim(); w.maxPunkte=+maxPunkte; saveData(); renderTabContent();
}
function deleteWdh(wid) {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const sem = cls[activeSemester];
    sem.wiederholungen = sem.wiederholungen.filter(w=>w.id!==wid);
    for (const sd of Object.values(sem.studentData)) delete sd.wiederholungen[wid];
    saveData(); renderTabContent();
}
function updateWdhField(sid, wid, val) {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const sem = cls[activeSemester];
    const sd = getSData(sem, sid);
    snapshotForUndo();
    if (val === 'abwesend') {
        const prev = sd.wiederholungen[wid];
        sd.wiederholungen[wid] = 'abwesend';
        if (prev !== null && prev !== undefined && prev !== '' && prev !== 'abwesend') {
            sd.wiederholungen[wid + '__prev'] = prev;
        }
    } else if (val === '__restore__') {
        const saved = sd.wiederholungen[wid + '__prev'];
        delete sd.wiederholungen[wid + '__prev'];
        sd.wiederholungen[wid] = (saved !== undefined) ? saved : null;
    } else {
        delete sd.wiederholungen[wid + '__prev'];
        const n = val==='' ? null : parseFloat(val);
        sd.wiederholungen[wid] = (val===''||isNaN(n)) ? null : n;
    }
    if (!isNaN(parseFloat(val)) && val !== 'abwesend' && window.pixelguyNoteHint) {
        const _wObj = sem.wiederholungen.find(x => x.id === wid);
        if (_wObj) {
            const _wPct = (parseFloat(val) / _wObj.maxPunkte) * 100;
            const _wN = pctToNote(_wPct);
            if (_wN === 1 || _wN === 5) window.pixelguyNoteHint(_wN);
        }
    }
    saveDataWithUndo();
    renderTabContent();
}

    const cls = activeClasses().find(c=>c.id===activeClassId);

    document.querySelectorAll('#class-tabs .nav-link').forEach(a => {
        const t = a.getAttribute('onclick').match(/'(\w+)'/)?.[1];
        a.classList.toggle('active', t===activeTab);
    });

function renderTabContent() {
    const area = document.getElementById('tab-content');
    if (!area) return;
    const cls = activeClasses().find(c=>c.id===activeClassId);
    if (!cls) return;
    const sem = cls[activeSemester];
    switch(activeTab) {
        case 'sa':     area.innerHTML = renderTabSA(cls, sem);     attachSAListeners();    break;
        case 'wdh':    area.innerHTML = renderTabWDH(cls, sem);    attachWDHListeners();   break;
        case 'praes':  area.innerHTML = renderTabPraes(cls, sem);  attachPraesListeners(); break;
        case 'ha':     area.innerHTML = renderTabHA(cls, sem);     attachHAListeners();    break;
        case 'mm':       area.innerHTML = renderTabMM(cls, sem);        attachMMListeners();       break;
        case 'gesamt':   area.innerHTML = renderTabGesamt(cls, sem);    attachGesamtListeners();   break;
        case 'jahr':     area.innerHTML = renderTabJahresnote(cls);     attachJahrListeners();     break;
        case 'schueler': area.innerHTML = renderTabSchueler(cls);       attachSchuelerListeners(); break;

function haStats(sem, sid) {
    const sd = sem.studentData?.[sid] || {};
    let achieved=0, possible=0;
    for (const h of sem.hausaufgaben) {
        const val = sd.hausaufgaben?.[h.id];
        if (val===null||val===undefined||val===''||val==='k') continue;
        const v = parseFloat(val);
        if (!isNaN(v)) { achieved+=v; possible+=1; }
    }
    return possible===0 ? {achieved:null,possible:null} : {achieved, possible};
}

    document.querySelectorAll('.ha-alle-select').forEach(sel => {

function setAllHA(hid, val) {
    const cls = activeClasses().find(c => c.id === activeClassId); if(!cls) return;
    const sem = cls[activeSemester];
    snapshotForUndo();
    for (const s of cls.students) {
        getSData(sem, s.id).hausaufgaben[hid] = val === '' ? null : val;
    }
    saveDataWithUndo();
    renderTabContent();
}

function updateHACells(sem, s) {
    const {achieved, possible} = haStats(sem, s.id);
    const pct = possible>0 ? (achieved/possible)*100 : null;
    const note = pct!==null ? pctToNote(pct) : null;
    setTxt('ha-pts-'+s.id, achieved!==null?achieved.toFixed(2)+'/'+possible:'—');
    setTxt('ha-pct-'+s.id, pct!==null?fmtPct(pct):'—');
    setBadgeInt('ha-note-'+s.id, note);
}

// Hat der Schüler mindestens eine positive Schularbeit (Note ≤ 4)?
function hasPositiveSA(sem, s) {
    const sas = sem.schularbeiten || [];
    if (sas.length === 0) return true;
    const sd = sem.studentData?.[s.id] || {};
    return sas.some(sa => {
        const saData = sd.schularbeiten?.[sa.id];
        if (!saData) return false;
        // Oberstufe: direkt eingegebene Note
        if (saData.note !== undefined && saData.note !== null && saData.note !== '') {
            return +saData.note <= 4;
        }
        // Unterstufe: Punkte-basiert
        const n = calcNote(calcGesamt(saData, sa.fehlerProPunkt ?? 3));
        return n !== null && n.note <= 4;
    });
}

                        const zpAdj = sd.zwischenpruefung ?? null;

                            : forced
                                ? `<span class="note-badge note-5" title="Automatische 5: keine positive Schularbeit">5 ⚠</span>`
                                : `<span class="note-badge note-${intNote}">${intNote}</span>`;
                        const decCell   = gesAdj !== null
                            ? `<span class="cell-ro" style="font-weight:600">${fmtNote(gesAdj)}</span>`
                            : '<span class="text-muted small">—</span>';
                        const saGesamtInt = saGesamt !== null ? noteInt(saGesamt) : null;
                        const saGesamtBadge = saGesamtInt === null
                            ? '<span class="note-badge note-empty">—</span>'
                            : `<span class="note-badge note-${saGesamtInt}">${fmtNote2(saGesamt)}</span>`;

                        return `<tr data-sid="${s.id}">
                            <td class="sticky-col">${studentNameCell(s)}</td>
                            ${sas.map(sa => {
                                const saData = sd.schularbeiten?.[sa.id];
                                const saId2 = 'gsn-'+sa.id+'-'+s.id;
                                if (cls.type === 'oberstufe') {
                                    const noteVal = saData?.note !== undefined && saData?.note !== null && saData?.note !== '' ? +saData.note : null;
                                    return noteVal !== null
                                        ? `<td class="td-sa1 text-center"><span class="note-badge note-${noteVal}" id="${saId2}">${noteVal}</span></td>`
                                        : `<td class="td-sa1 text-center"><span class="note-badge note-empty" id="${saId2}">—</span></td>`;
                                }
                                const n = saData ? calcNote(calcGesamt(saData, sa.fehlerProPunkt ?? 3)) : null;
                                return n
                                    ? `<td class="td-sa1 text-center"><span class="note-badge note-${n.note}" id="${saId2}">${fmtNoteModifier(n.decimal)}</span></td>`
                                    : `<td class="td-sa1 text-center"><span class="note-badge note-empty" id="${saId2}">—</span></td>`;
                            }).join('')}
                            <td class="td-sa1 text-center" style="border-left:2px solid #90a4ae"><span id="gesamt-sa-${s.id}">${saGesamtBadge}</span></td>
                            <td class="td-wdh text-center">${wdh !== null ? `<span class="note-badge note-${noteInt(wdh)}" id="gswdh-${s.id}">${fmtNote2(wdh)}</span>` : `<span class="note-badge note-empty" id="gswdh-${s.id}">—</span>`}</td>
                            <td class="td-praes text-center">${pr !== null ? `<span class="note-badge note-${noteInt(pr)}" id="gspr-${s.id}">${fmtNote2(pr)}</span>` : `<span class="note-badge note-empty" id="gspr-${s.id}">—</span>`}</td>
                            <td class="td-ha text-center">${ha !== null ? `<span class="note-badge note-${ha}" id="gsha-${s.id}">${fmtNote2(ha)}</span>` : `<span class="note-badge note-empty" id="gsha-${s.id}">—</span>`}</td>
                            <td class="td-praes text-center">${mm !== null ? `<span class="note-badge note-${mm}" id="gsmm-${s.id}">${mm}</span>` : `<span class="note-badge note-empty" id="gsmm-${s.id}">—</span>`}</td>
                            <td class="td-zp text-center">
                                <select class="zp-select" data-sid="${s.id}"${zpAdj !== null ? ' style="border-color:#9c27b0;background:#f3e5f5;"' : ''}>
                                    <option value=""${zpAdj === null ? ' selected' : ''}></option>
                                    <option value="-0.5"${zpAdj === -0.5 ? ' selected' : ''}>verbessert (−0,5)</option>
                                    <option value="0"${zpAdj !== null && zpAdj === 0 ? ' selected' : ''}>gleich (±0)</option>
                                    <option value="0.5"${zpAdj === 0.5 ? ' selected' : ''}>verschlechtert (+0,5)</option>
                                </select>
                            </td>
                            <td class="text-center"><span id="gesamt-int-${s.id}">${intBadge}</span></td>
                            <td class="text-center"><span id="gesamt-dec-${s.id}">${decCell}</span></td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>`}`;
}

function renderTabJahresnote(cls) {
    const jg = cls.jahresnote?.gewichtung || {semester1: 50, semester2: 50};
    const w1 = +(jg.semester1 || 0), w2 = +(jg.semester2 || 0);
    const totalW = w1 + w2;
    const warnClass = totalW===100?'weight-sum-ok':'weight-sum-warn';
    const warnTxt   = totalW===100?'✓ Summe: 100 %':`⚠ Summe: ${totalW} % (sollte 100 % sein)`;

    return `
        <div class="weight-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong>Gewichtung der Semester</strong>
                <span class="${warnClass}" id="jahr-weight-sum">${warnTxt}</span>
            </div>
            <div class="d-flex flex-wrap gap-3">
                ${jahrWeightInput('semester1', '1. Semester', jg.semester1)}
                ${jahrWeightInput('semester2', '2. Semester', jg.semester2)}
            </div>
        </div>
        ${!cls.students.length ? emptyStudents() : `
        <div class="table-wrapper">
            <table class="grade-table table table-bordered table-sm mb-0">
                <thead>
                    <tr>
                        <th class="sticky-col" style="">Name</th>
                        <th class="text-center th-sa1">1. Semester<br><small>${w1} %</small></th>
                        <th class="text-center th-sa2">2. Semester<br><small>${w2} %</small></th>
                        <th class="text-center" style="background:#1a6651;color:#fff;min-width:80px">Jahresnote</th>
                        <th class="text-center" style="min-width:70px">Dezimal</th>
                    </tr>
                </thead>
                <tbody id="jahr-tbody">
                    ${cls.students.map(s => {
                        const n1 = calcGesamtnote(cls, cls.semester1, s);
                        const n2 = calcGesamtnote(cls, cls.semester2, s);
                        const n1Int = n1 !== null ? noteInt(n1) : null;
                        const n2Int = n2 !== null ? noteInt(n2) : null;
                        const forced1 = cls.type !== 'oberstufe' && (() => { const sas=cls.semester1.schularbeiten||[]; const sd=cls.semester1.studentData?.[s.id]||{}; return sas.some(sa=>sd.schularbeiten?.[sa.id]) && !hasPositiveSA(cls.semester1,s); })();
                        const forced2 = cls.type !== 'oberstufe' && (() => { const sas=cls.semester2.schularbeiten||[]; const sd=cls.semester2.studentData?.[s.id]||{}; return sas.some(sa=>sd.schularbeiten?.[sa.id]) && !hasPositiveSA(cls.semester2,s); })();
                        const semCell = (nInt, dec, forced, forcedLabel='5 ⚠') => {
                            if (dec === null) return '<span class="note-badge note-empty">—</span>';
                            if (forced) return `<div class="d-flex justify-content-center align-items-center"><span class="note-badge note-5" style="flex-shrink:0" title="Automatische 5">${forcedLabel}</span><span style="min-width:2.8rem"></span></div>`;
                            return `<div class="d-flex justify-content-center align-items-center"><span class="note-badge note-${nInt}" style="flex-shrink:0">${nInt}</span><span class="text-muted" style="font-size:.75rem;min-width:2.8rem;padding-left:.35rem">${fmtNote2(dec)}</span></div>`;
                        };
                        const badge1 = semCell(n1Int, n1, forced1);
                        const badge2 = semCell(n2Int, n2, forced2);
                        const jahr = calcJahresnote(cls, s);
                        const jahrInt = jahr !== null ? noteInt(jahr) : null;
                        const jahrBadge = jahrInt === null
                            ? '<span class="note-badge note-empty">—</span>'
                            : `<span class="note-badge note-${jahrInt}">${jahrInt}</span>`;
                        const jahrDec = jahr !== null
                            ? `<span class="cell-ro" style="font-weight:600">${fmtNote(jahr)}</span>`
                            : '<span class="text-muted small">—</span>';
                        return `<tr data-sid="${s.id}">
                            <td class="sticky-col">${studentNameCell(s)}</td>
                            <td class="td-sa1 text-center">${badge1}</td>
                            <td class="td-sa2 text-center">${badge2}</td>
                            <td class="text-center"><span id="jahr-int-${s.id}">${jahrBadge}</span></td>
                            <td class="text-center"><span id="jahr-dec-${s.id}">${jahrDec}</span></td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>`}`;
}

        <div class="input-group input-group-sm" style="width:90px">

                   value="${val||0}" data-key="${key}" id="jw-${key}">

}

function attachJahrListeners() {

function updateJahrGewichtung(key, val) {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    snapshotForUndo();
    if (!cls.jahresnote) cls.jahresnote = {gewichtung: {semester1: 50, semester2: 50}};
    cls.jahresnote.gewichtung[key] = +val || 0;
    saveDataWithUndo();
    render();
}

function updateJahrWeightSum() {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const jg = cls.jahresnote?.gewichtung || {};
    const total = (+(jg.semester1)||0)+(+(jg.semester2)||0);
    const el = document.getElementById('jahr-weight-sum');

}

function updateJahrColumns(cls) {

function copyWeightsFromSem1() {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    snapshotForUndo();
    const src = cls.semester1.gewichtung;
    const dst = cls.semester2.gewichtung;
    dst.schularbeiten = src.schularbeiten;
    dst.wiederholung  = src.wiederholung;
    dst.praesentation = src.praesentation;

        inp.addEventListener('change', function() { updateGewichtung(this.dataset.key, this.value); });
    });
    const btnCopy = document.getElementById('btn-copy-weights');
    if (btnCopy) btnCopy.addEventListener('click', copyWeightsFromSem1);

        sel.addEventListener('change', function() { updateZwischenpruefung(this.dataset.sid, this.value); });

function updateGesamtColumn(cls, sem) {
    if (activeTab !== 'gesamt') return;
    document.querySelectorAll('#gesamt-tbody tr').forEach(row => {
        const sid = row.dataset.sid;
        const s = cls.students.find(s=>s.id===sid); if(!s) return;
        const sd = sem.studentData?.[s.id] || {};
        const ges = calcGesamtnote(cls, sem, s);
        const zpAdj = sd.zwischenpruefung ?? null;
        const gesAdj = (ges !== null && zpAdj !== null) ? ges + zpAdj : ges;

        const sas = sem.schularbeiten || [];
        const hasSAData = sas.some(sa => sd.schularbeiten?.[sa.id]);
        const forced    = cls.type !== 'oberstufe' && hasSAData && !hasPositiveSA(sem, s);
        const intNote   = forced ? 5 : (gesAdj !== null ? noteInt(gesAdj) : null);

        const saGesamt = calcSATeilnote(sem, s.id);
        const saGesamtInt = saGesamt !== null ? noteInt(saGesamt) : null;
        const saEl = document.getElementById('gesamt-sa-'+sid);
        if (saEl) {
            saEl.innerHTML = saGesamtInt === null
                ? '<span class="note-badge note-empty">—</span>'
                : `<span class="note-badge note-${saGesamtInt}">${fmtNote2(saGesamt)}</span>`;
        }
        const intEl = document.getElementById('gesamt-int-'+sid);
        if (intEl) {
            intEl.innerHTML = intNote === null
                ? '<span class="note-badge note-empty">—</span>'
                : forced
                    ? `<span class="note-badge note-5" title="Automatische 5: keine positive Schularbeit">5 ⚠</span>`
                    : `<span class="note-badge note-${intNote}">${intNote}</span>`;
        }
        const decEl = document.getElementById('gesamt-dec-'+sid);
        if (decEl) {
            decEl.innerHTML = gesAdj !== null
                ? `<span class="cell-ro" style="font-weight:600">${fmtNote(gesAdj)}</span>`
                : '<span class="text-muted small">—</span>';
        }
    });
}

function updateWeightSum() {
    const cls = activeClasses().find(c=>c.id===activeClassId); if(!cls) return;
    const sem = cls[activeSemester];
    const g = sem.gewichtung;
    const total = (+(g.schularbeiten)||0)+(+(g.wiederholung)||0)+(+(g.praesentation)||0)+(+(g.hausaufgaben)||0)+(+(g.muendlich)||0);
    const el = document.getElementById('weight-sum-display');
    if (!el) return;
    if (total===100) { el.className='weight-sum-ok'; el.textContent='✓ Summe: 100 %'; }
    else             { el.className='weight-sum-warn'; el.textContent=`⚠ Summe: ${total} % (sollte 100 % sein)`; }
}

document.addEventListener('DOMContentLoaded', async () => {
    await loadData();
    activeClassId = activeClasses()[0]?.id ?? null;
    const _initCls = activeClasses()[0];

    // Close dialog on backdrop click
    document.querySelectorAll('dialog').forEach(d => {
        d.addEventListener('click', e => { if (e.target === d) d.close(); });

    });

        document.getElementById('inp-class-name').value='';
        document.getElementById('inp-class-type').value='oberstufe';
        document.querySelector('#modalAddClass .modal-title').innerHTML='<i class="bi bi-folder-plus"></i>Neue Oberstufen-Klasse';
        showModal('modalAddClass');
    });
    document.getElementById('btn-save-add-class').addEventListener('click', ()=>{
        const n=document.getElementById('inp-class-name').value.trim(); if(!n) return;
        const t=document.getElementById('inp-class-type').value;
        hideModal('modalAddClass'); addClass(n, t);
    });
    onEnter('inp-class-name','btn-save-add-class');

    document.getElementById('btn-save-edit-class').addEventListener('click', ()=>{
        const id=document.getElementById('inp-edit-class-id').value;
        const n=document.getElementById('inp-edit-class-name').value.trim(); if(!n) return;
        hideModal('modalEditClass'); editClass(id, n);
    });
    onEnter('inp-edit-class-name','btn-save-edit-class');

    // Schüler
    document.getElementById('btn-save-add-student').addEventListener('click', ()=>{
        const n=document.getElementById('inp-student-name').value.trim(); if(!n||!activeClassId) return;
        hideModal('modalAddStudent'); addStudent(activeClassId, n);
    });
    onEnter('inp-student-name','btn-save-add-student');

    document.getElementById('btn-save-edit-student').addEventListener('click', ()=>{
        const id=document.getElementById('inp-edit-student-id').value;
        const n=document.getElementById('inp-edit-student-name').value.trim(); if(!n) return;
        hideModal('modalEditStudent'); editStudent(id, n);
    });
    onEnter('inp-edit-student-name','btn-save-edit-student');

    // Wiederholung
    document.getElementById('btn-save-wdh').addEventListener('click', ()=>{
        const id=document.getElementById('inp-wdh-id').value;
        const name=document.getElementById('inp-wdh-name').value.trim();
        const max=document.getElementById('inp-wdh-max').value;
        if (!name||!max) return;
        hideModal('modalWdh');
        if (id) editWdh(id, name, max); else addWdh(name, max);
    });
    onEnter('inp-wdh-name','btn-save-wdh');

    // Präsentation
    document.getElementById('btn-save-praes').addEventListener('click', ()=>{
        const id=document.getElementById('inp-praes-id').value;
        const name=document.getElementById('inp-praes-name').value.trim(); if(!name) return;
        hideModal('modalPraes');
        if (id) editPraes(id, name); else addPraes(name);
    });
    onEnter('inp-praes-name','btn-save-praes');

    // Hausübung
    document.getElementById('btn-save-ha').addEventListener('click', ()=>{
        const id=document.getElementById('inp-ha-id').value;
        const name=document.getElementById('inp-ha-name').value.trim(); if(!name) return;
        hideModal('modalHA');
        if (id) editHA(id, name); else addHA(name);
    });
    onEnter('inp-ha-name','btn-save-ha');

    // Löschen bestätigen
    document.getElementById('btn-confirm-delete').addEventListener('click', ()=>{
        hideModal('modalConfirmDelete');
        if (pendingDelete) { pendingDelete(); pendingDelete=null; }
    });

    // Neues Schuljahr
    document.getElementById('btn-save-add-sj').addEventListener('click', ()=>{
        const n = document.getElementById('inp-sj-name').value.trim();
        if (!n) return;
        hideModal('modalAddSchuljahr');
        addSchuljahr(n);
    });
    onEnter('inp-sj-name', 'btn-save-add-sj');

    // Schuljahr umbenennen
    document.getElementById('btn-save-edit-sj').addEventListener('click', ()=>{
        const id = document.getElementById('inp-edit-sj-id').value;
        const n = document.getElementById('inp-edit-sj-name').value.trim();
        if (!n) return;
        hideModal('modalEditSchuljahr');
        editSchuljahr(id, n);
    });
    onEnter('inp-edit-sj-name', 'btn-save-edit-sj');

    // Menüs schließen bei Klick außerhalb
    document.addEventListener('click', () => closeSjMenus());
});
</script>

function randomSpruch(context) {
  const pool = SPRUECHE[context] || SPRUECHE.pageload;
  return pool[Math.floor(Math.random() * pool.length)];
}

let overlayEl = null;
let hideTimer = null;

function ensureOverlay() {
  if (overlayEl) return;
  overlayEl = document.createElement('div');
  overlayEl.id = 'pixelguy-overlay';
  overlayEl.style.cssText = [
    'position:fixed',
    'z-index:9999',
    'pointer-events:none',
    'display:none',
    'flex-direction:column',
    'align-items:center',
    'gap:6px',
    'transition:opacity 0.4s ease',
    'opacity:0',
  ].join(';');
  document.body.appendChild(overlayEl);
}

function buildBubble(text) {
  return `
    <div style="
      background:#fff;
      border:2px solid #2a2a36;
      border-radius:10px;
      padding:8px 12px;
      max-width:200px;
      font-size:13px;
      font-family:'Inter',sans-serif;
      line-height:1.4;
      color:#2a2a36;
      box-shadow:3px 3px 0 #2a2a3640;
      position:relative;
    ">
      ${text}
      <div style="
        position:absolute;
        bottom:-10px;
        left:50%;
        transform:translateX(-50%);
        width:0;height:0;
        border-left:8px solid transparent;
        border-right:8px solid transparent;
        border-top:10px solid #2a2a36;
      "></div>
      <div style="
        position:absolute;
        bottom:-7px;
        left:50%;
        transform:translateX(-50%);
        width:0;height:0;
        border-left:7px solid transparent;
        border-right:7px solid transparent;
        border-top:9px solid #fff;
      "></div>
    </div>`;
}

function randomPosition(overlayW, overlayH) {
  const margin = 20;
  const maxX = window.innerWidth  - overlayW - margin;
  const maxY = window.innerHeight - overlayH - margin;
  const x = margin + Math.floor(Math.random() * Math.max(1, maxX - margin));
  const y = margin + Math.floor(Math.random() * Math.max(1, maxY - margin));
  return {x, y};
}

const pixelguy = {
  show(context) {
    ensureOverlay();
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }

    const text = randomSpruch(context);
    overlayEl.innerHTML = buildBubble(text) + `
      <div style="position:relative;align-self:flex-end">
        ${buildSVG()}
        <button id="pixelguy-close" style="
          position:absolute;top:-6px;right:-6px;
          width:18px;height:18px;
          background:#2a2a36;color:#fff;
          border:none;border-radius:50%;
          font-size:11px;line-height:18px;text-align:center;
          cursor:pointer;pointer-events:auto;
          padding:0;
        ">×</button>
      </div>`;
    overlayEl.style.display = 'flex';
    document.getElementById('pixelguy-close').addEventListener('click', () => pixelguy.hide());

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const {x, y} = randomPosition(overlayEl.offsetWidth || 220, overlayEl.offsetHeight || 180);
        overlayEl.style.left = x + 'px';
        overlayEl.style.top  = y + 'px';
        overlayEl.style.opacity = '1';
      });
    });

    hideTimer = setTimeout(() => pixelguy.hide(), 10000);
  },

  maybeShow(context, probability = 0.4) {
    if (Math.random() < probability) this.show(context);
  },

  hide() {
    if (!overlayEl) return;
    overlayEl.style.opacity = '0';
    setTimeout(() => { if (overlayEl) overlayEl.style.display = 'none'; }, 450);
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  },
};

window.addEventListener('DOMContentLoaded', () => {
  const _origSaveDataWithUndo = window.saveDataWithUndo;
  if (typeof _origSaveDataWithUndo === 'function') {
    window.saveDataWithUndo = function() {
      _origSaveDataWithUndo.apply(this, arguments);
      const n = pixelguy._pendingNote;
      pixelguy._pendingNote = null;
      if (n === 1) pixelguy.maybeShow('note_1');
      else if (n === 5) pixelguy.maybeShow('note_5');
    };
  }
  pixelguy.show('pageload');
});

window.pixelguyNoteHint = function(note) {
  pixelguy._pendingNote = +note;
};

window.pixelguy = pixelguy;

let pixelguyEnabled = true;

window.togglePixelguy = function() {
  pixelguyEnabled = !pixelguyEnabled;
  const icon = document.getElementById('avatar-toggle-icon');
  if (pixelguyEnabled) {
    icon.className = 'bi bi-person-fill';
    document.getElementById('avatar-toggle').title = 'Avatar ausschalten';
  } else {
    icon.className = 'bi bi-person-slash';
    document.getElementById('avatar-toggle').title = 'Avatar einschalten';
    pixelguy.hide();
  }
};

const _origShow = pixelguy.show.bind(pixelguy);
const _origMaybeShow = pixelguy.maybeShow.bind(pixelguy);
pixelguy.show = function(ctx) { if (pixelguyEnabled) _origShow(ctx); };
pixelguy.maybeShow = function(ctx, p) { if (pixelguyEnabled) _origMaybeShow(ctx, p); };
})();
</script>
</body>
</html>
